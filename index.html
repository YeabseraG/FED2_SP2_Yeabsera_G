<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auction House | Home</title>

  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">AuctionHouse</a>

      <div class="search">
        <input type="text" placeholder="Search listings..." />
      </div>

      <nav class="nav-links" id="nav-links">
        <!-- Visible when logged OUT -->
        <a href="./pages/login.html">Log in</a>
        <a href="./pages/register.html" class="btn-outline">Sign up</a>

        <!-- Visible when logged IN -->
        <!--
        <span class="credits">Credits: 1000</span>
        <a href="./pages/profile.html">Profile</a>
        <button class="btn-link">Log out</button>
        -->
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container">

    <section class="section-header">
      <h2>Highlighted items</h2>
      <a href="#" class="link">Show all →</a>
    </section>

    <!-- LISTINGS GRID -->
    <section class="grid" id="listings-grid">
      <!-- Listing card (repeat dynamically later) -->
      <article class="card">
        <div class="card-image">
          <img src="https://via.placeholder.com/400x300" alt="Listing image" />
          <button class="favorite">♡</button>
        </div>

        <div class="card-body">
          <h3>Vintage Landscape Painting</h3>
          <p class="meta">3 bids · 4h 20m</p>
          <p class="price">249 EUR</p>
        </div>
      </article>

      <!-- Duplicate cards for layout preview -->
      <article class="card">
        <div class="card-image">
          <img src="https://via.placeholder.com/400x300" alt="Listing image" />
          <button class="favorite">♡</button>
        </div>
        <div class="card-body">
          <h3>Ceramic Vase</h3>
          <p class="meta">10 bids · 6h 10m</p>
          <p class="price">180 EUR</p>
        </div>
      </article>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <p>© 2025 AuctionHouse</p>
    </div>
  </footer>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/utils.js"></script>

</body>
</html>
